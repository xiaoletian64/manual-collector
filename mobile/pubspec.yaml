name: manual_collector
description: Offline paper manual archive with searchable PDFs.
publish_to: none
version: 0.2.1+5
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  pdf: ^3.11.3
  image: ^4.5.4
  share_plus: ^12.0.1
  pdfrx: ^2.2.24
  uuid: ^4.5.2
  crypto: ^3.0.7
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-Regular.ttf
    - assets/fonts/OFL.txt
